name: CI/CD Pipeline

on:
  push:
    branches: [ main ]   # 如果是 master 则改成 master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: 运行测试
        run: pytest test_app.py

      - name: 构建 Docker 镜像
        run: |
          docker build -t simple-web-cicd:${{ github.sha }} .
          docker tag simple-web-cicd:${{ github.sha }} simple-web-cicd:latest

      - name: 登录到阿里云/腾讯云/华为云 Docker 镜像仓库（可选）
        # 如果你有云镜像仓库，可在此配置登录；否则跳过这一步
        # 如果只是部署到云服务器，可以不用推送镜像仓库，直接 scp 或 docker save 传输
        run: echo "跳过镜像推送，后续直接部署到云服务器"

      - name: 部署到云服务器（示例：通过 SSH 执行命令）
        # 需要在 GitHub Secrets 中配置云服务器的 IP、用户名、SSH 私钥
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /root/simple-web-cicd   # 假设你在服务器上放代码的目录
            git pull
            docker build -t simple-web-cicd .
            docker stop simple-web || true
            docker rm simple-web || true
            docker run -d -p 5000:5000 --name simple-web simple-web-cicd
